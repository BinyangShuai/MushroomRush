<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mushroom Rush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="join">
  <h1>🍄 Mushroom Rush</h1>
  <input id="roomId" placeholder="Room ID (e.g. ABC123)" />
  <input id="name" placeholder="Enter name" />
  <button id="joinBtn">Join</button>
</div>

<div id="game" hidden>

  <!-- ✅ Top control bar -->
  <div id="topBar">
    <div id="title">🍄 Mushroom Rush</div>
    <div id="playerInfo"></div>
    <div id="timer">Time: 60</div>
    <div id="controls">
      <button id="startBtn" hidden>Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resumeBtn">Resume</button>
    </div>
  </div>

  <!-- System messages -->
  <div id="message"></div>

  <!-- Game field -->
  <div id="field"></div>

  <!-- Score panel -->
  <div id="scorePanel">
    <h3>Scores</h3>
    <ul id="scores"></ul>
  </div>

</div>

<!-- ESC Menu -->
<div id="menu" class="overlay hidden">
  <div class="panel">
    <h2>Game Menu</h2>
    <button id="menuResume">Resume</button>
    <button id="menuQuit">Quit</button>
  </div>
</div>

<!-- Winner popup -->
<div id="winner" class="overlay hidden">
  <div class="panel">
    <h2 id="winnerText"></h2>

    <!-- ✅ Buttons only for host -->
    <button id="playAgainBtn" hidden>Start Next Round</button>

    <!-- Optional: Back to lobby -->
    <button onclick="location.reload()">Back to Lobby</button>
  </div>
</div>

<script src="client.js"></script>
</body>
</html>
